name: tilawa
description: "Offline Quran recitation correction (Hafs & Warsh)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  path: ^1.9.1
  record: ^7.1.2
  sqflite: ^2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    # Quran DBs built by tools/build_quran_db.py (sources: docs/DATA_SOURCES.md).
    - assets/quran/hafs.sqlite
    - assets/quran/warsh.sqlite
    - assets/fonts/KFGQPC-Warsh-font-license.txt
    - assets/fonts/AmiriQuran-OFL.txt
  fonts:
    # Fallback Hafs font (approved by the product owner). Replaced by the KFGQPC Hafs font if
    # its terms allow. Warsh REQUIRES the KFGQPC Warsh font (font-specific text encoding).
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    # Official KFGQPC Warsh font v2.1, unmodified. Required: the Warsh text uses its encoding.
    - family: KfgqpcWarsh
      fonts:
        - asset: assets/fonts/uthmanic_warsh_v21.ttf
