name: tilawa
description: "Offline Quran recitation correction (Hafs & Warsh)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path: ^1.9.1
  sqflite: ^2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    # Quran DBs built by tools/build_quran_db.py (warsh.sqlite added once the official
    # KFGQPC files are available, see docs/DATA_SOURCES.md).
    - assets/quran/hafs.sqlite
